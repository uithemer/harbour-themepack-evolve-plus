name: CI

env:
  RELEASE: 5.0.0.43

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install icon verification tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inkscape python3-pil python3-numpy

      # Gradients drawn with coordinates far outside the document rely on the
      # renderer's fixed point range; cairo clips them and the icon loses whole
      # faces. Catch that in the source rather than in a release.
      - name: Check gradients are normalised
        run: python3 tools/normalize-gradients.py --check $(find theme -name '*.svg')

      # The PNGs are committed and are what ships, so CI must not silently
      # re-export them: it verifies they still match the SVGs instead.
      - name: Verify committed PNGs match their SVG sources
        run: |
          cp -a theme "${RUNNER_TEMP}/theme-check"
          (cd "${RUNNER_TEMP}/theme-check" && ./themepack-helper.sh)
          python3 tools/compare-icons.py theme "${RUNNER_TEMP}/theme-check"

      - name: Prepare
        run: mkdir -p RPMS

      - name: Build aarch64
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: aarch64

      - name: Build armv7hl
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: armv7hl

      - name: Build i486
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: i486

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: RPM-build-results_SFOS${{ env.RELEASE }}+
          path: RPMS/

      - name: Upload RPMs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RPMS/*.rpm
